name: Build and deploy DashLab+
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  deploy:
    runs-on: dashlab
    steps:
      - uses: actions/checkout@v4
      - name: Configure remote Docker target
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          apt-get update
          apt-get install -y openssh-client
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          test -n "$DEPLOY_SSH_HOST" -a -n "$DEPLOY_SSH_USER" -a -n "$DEPLOY_SSH_PRIVATE_KEY" -a -n "$DEPLOY_SSH_KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          printf 'DOCKER_HOST=ssh://%s@%s\n' "$DEPLOY_SSH_USER" "$DEPLOY_SSH_HOST" >> "$GITHUB_ENV"
          printf 'DOCKER_SSH_COMMAND=ssh -i %s -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=%s\n' "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"
          docker -H "ssh://$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" version
      - name: Ensure Docker CLI and Compose
        run: |
          set -eu
          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            exit 0
          fi
          apt-get update
          apt-get install -y curl ca-certificates
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-29.1.3.tgz -o /tmp/docker.tgz
          tar -xzf /tmp/docker.tgz -C /tmp
          install -m 0755 /tmp/docker/docker /usr/local/bin/docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-x86_64 -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose
          docker version
          docker compose version
      - name: Validate secrets
        env:
          PROMETHEUS_URL: '${{ secrets.PROMETHEUS_URL }}'
          PROMETHEUS_TARGET_LABELS: '${{ secrets.PROMETHEUS_TARGET_LABELS }}'
          PROMETHEUS_NETWORK_LABELS: '${{ secrets.PROMETHEUS_NETWORK_LABELS }}'
          PROMETHEUS_DISK_LABELS: '${{ secrets.PROMETHEUS_DISK_LABELS }}'
        run: |
          set -eu
          test -n "$PROMETHEUS_URL" || echo "Prometheus is optional; metrics will stay unavailable"
      - name: Test and build
        run: |
          npm --prefix web ci
          npm --prefix web run build
          docker build --file Dockerfile.api --tag dashlab-plus-api:test .
      - name: Deploy containers
        env:
          PROMETHEUS_URL: '${{ secrets.PROMETHEUS_URL }}'
          PROMETHEUS_TARGET_LABELS: '${{ secrets.PROMETHEUS_TARGET_LABELS }}'
          PROMETHEUS_NETWORK_LABELS: '${{ secrets.PROMETHEUS_NETWORK_LABELS }}'
          PROMETHEUS_DISK_LABELS: '${{ secrets.PROMETHEUS_DISK_LABELS }}'
        run: |
          set -eu
          if docker compose version >/dev/null 2>&1; then
            COMPOSE="docker compose"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE="docker-compose"
          else
            echo "Docker Compose is unavailable"
            exit 1
          fi
          umask 077
          printf 'PROMETHEUS_URL=%s\nPROMETHEUS_TARGET_LABELS=%s\nPROMETHEUS_NETWORK_LABELS=%s\nPROMETHEUS_DISK_LABELS=%s\n' "$PROMETHEUS_URL" "$PROMETHEUS_TARGET_LABELS" "$PROMETHEUS_NETWORK_LABELS" "$PROMETHEUS_DISK_LABELS" > .env
          # O host de deploy não possui rota IPv6 para o Docker Hub. Não force
          # uma consulta ao registry quando as imagens-base já estão no cache.
          $COMPOSE --env-file .env build
          $COMPOSE --env-file .env up -d --remove-orphans
          $COMPOSE --env-file .env ps
