name: dashlab-plus

services:
  dashlab-plus:
    image: ghcr.io/ferforastieri/dashlab-plus:latest
    container_name: dashlab-plus
    pull_policy: always
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    ports: ['0.0.0.0:3000:3000']
    volumes: [dashlab_plus_data:/data]

  dashlab-plus-updater:
    build: ./updater
    container_name: dashlab-plus-updater
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro

volumes:
  dashlab_plus_data:
    name: dashlab_plus_data
