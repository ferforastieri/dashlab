name: dashlab-plus

services:
  dashlab-plus:
    image: ${DASHLAB_IMAGE:-ghcr.io/ferforastieri/dashlab-plus:latest}
    container_name: dashlab-plus
    pull_policy: always
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    environment:
      UPDATE_SERVICE_URL: http://dashlab-plus-updater:8080
      UPDATE_TOKEN: ${UPDATE_TOKEN:?UPDATE_TOKEN não configurado}
      DASHLAB_AUTH_USER: ${DASHLAB_AUTH_USER:?DASHLAB_AUTH_USER não configurado}
      DASHLAB_AUTH_PASSWORD: ${DASHLAB_AUTH_PASSWORD:?DASHLAB_AUTH_PASSWORD não configurado}
      OUTBOUND_ALLOWLIST: ${OUTBOUND_ALLOWLIST:-}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      PROMETHEUS_TARGET_LABELS: ${PROMETHEUS_TARGET_LABELS:-}
      PROMETHEUS_NETWORK_LABELS: ${PROMETHEUS_NETWORK_LABELS:-device!="lo"}
      PROMETHEUS_DISK_LABELS: ${PROMETHEUS_DISK_LABELS:-device=~"nvme[0-9]+n[0-9]+|sd[a-z]+"}
    volumes: [dashlab_plus_data:/data]

  dashlab-plus-updater:
    build: ./updater
    container_name: dashlab-plus-updater
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    environment:
      UPDATE_TOKEN: ${UPDATE_TOKEN:?UPDATE_TOKEN não configurado}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro

volumes:
  dashlab_plus_data:
    name: dashlab_plus_data
